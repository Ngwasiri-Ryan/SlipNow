name: slipnow
description: "SlipNow - GCE result slip self-service app (frontend)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  pdf: ^3.13.1
  pdfrx: ^2.4.8
  printing: ^5.15.1
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/results/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#00A355"
  image: "assets/icon.png"
  android_12:
    image: "assets/icon.png"
    icon_background_color: "#00A355"
